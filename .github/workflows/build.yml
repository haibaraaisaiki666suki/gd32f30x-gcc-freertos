name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ARM GNU Toolchain and GNU Make
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            make
          arm-none-eabi-gcc --version
          make --version

      - name: Check toolchain libraries
        run: |
          # libnewlib provides the C library and nosys.specs used by LDFLAGS.
          test -f "$(arm-none-eabi-gcc -print-file-name=libc.a)"
          test -f "$(arm-none-eabi-gcc -print-file-name=nosys.specs)"

      - name: Build
        run: make

      - name: Show size
        run: make size

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.elf
            build/*.hex
            build/*.bin
            build/*.map
          if-no-files-found: error
